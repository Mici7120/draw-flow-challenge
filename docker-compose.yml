services:
  dgraph:
    image: dgraph/standalone:v24.0.2
    ports:
      - "8080:8080"
      - "9080:9080"
    volumes:
      - dgraph_data:/dgraph
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "8081"
      DGRAPH_HTTP_URL: "http://dgraph:8080"
      PYTHON_BIN: "python3"
      RUN_TIMEOUT_SECONDS: "5"
      CORS_ORIGIN: "*"
    ports:
      - "8081:8081"
    depends_on:
      dgraph:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  dgraph_data:
